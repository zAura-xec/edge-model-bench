name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --python python --frozen --extra onnx
      - run: uv run --no-sync ruff check src tools examples tests
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python tools/audit_release.py
      - run: uv run --no-sync python -m build
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/edge-bench-wheel
          /tmp/edge-bench-wheel/bin/python -m pip install dist/*.whl onnx onnxruntime
          /tmp/edge-bench-wheel/bin/python examples/create_demo.py --output /tmp/edge-bench-demo
          cd /tmp
          /tmp/edge-bench-wheel/bin/edge-model-bench demo --print-config
          /tmp/edge-bench-wheel/bin/edge-model-bench demo demo_root=/tmp/edge-bench-demo
