# MTC calibration inputs retain their leading batch dimension, unlike the
# HBR-specific standard_npy dataset.
data_list: data.txt
raw_output_dir: npy
image_size: [224, 224]
max_samples: null

pipeline:
  - _target_: edge_model_bench.dataset.transform.LoadingImage
  - _target_: edge_model_bench.dataset.transform.BGR2RGB
  - _target_: edge_model_bench.dataset.transform.Resize
    size: ${...image_size}
  - _target_: edge_model_bench.dataset.transform.Normalize
    mean: [0, 0, 0]
    std: [255, 255, 255]
  - _target_: edge_model_bench.dataset.transform.HWC2NCHW
  - _target_: edge_model_bench.dataset.transform.SaveNpy
    output_dir: ${...raw_output_dir}
    drop_batch: false
    input_list_path: ${...raw_output_dir}/calib_list.txt

dataset:
  _target_: edge_model_bench.dataset.standard.StandardDataset
  images: ${..data_list}
  pipeline: ${..pipeline}
  max_samples: ${..max_samples}
