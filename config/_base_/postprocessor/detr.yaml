postprocessor:
  _target_: edge_model_bench.detector.detr.QnnDetr
  boxes: boxes
  logits: logits
  classes: classes
  # RF-DETR / simplified DETR export uses pixel xyxy; set cxcywh_norm for classic DETR
  box_format: xyxy
  conf_threshold: 0.5
  max_detections: 300
  num_classes: 80
  map_coco_categories: true
