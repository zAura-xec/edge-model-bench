# @package _global_
#
# MTC conversion is deliberately a separate stage from NPU evaluation.

defaults:
  - /_base_/converter@conversion: mtnn
  - _self_

benchmark_root: ${oc.env:BENCHMARK_ROOT,./benchmark}
work_root: ${oc.env:BENCHMARK_MTNN_WORK_ROOT,./work/mtnn/cls}
model_name: resnet18
precision: fp16
work_dir: ${work_root}/${model_name}_${precision}
save_result: false

conversion:
  input_model: ${benchmark_root}/onnx/cls/${model_name}-onnx-float/${model_name}.onnx
  output_dir: ${work_dir}/mtnn
  mtnn_config:
    # Avoid collisions in the toolkit global output directory.
    name: ${model_name}_${precision}
    artifact_path: ${work_dir}/mtnn/${model_name}_${precision}.mtnn

pipeline:
  _target_: edge_model_bench.pipeline.model_converter.ModelConverter
  converter: ${conversion.converter}
