# @package _global_
#
# Semantic-segmentation evaluation for an existing compiled QNN model.

defaults:
  - /_base_/postprocessor@postprocess: semantic_segmentation
  - _self_

benchmark_root: ${oc.env:BENCHMARK_ROOT,./benchmark}
work_root: ${oc.env:BENCHMARK_WORK_ROOT,./work}
model_name: deeplabv3_plus_mobilenet
input_size: [520, 520]
precision: fp16
num_classes: 21
work_dir: ${work_root}/${model_name}_${precision}
input_bin: ${work_dir}/qnn/${model_name}_compiled.bin
voc_root: ${benchmark_root}/dataset/VOCdevkit
validation_csv: ${voc_root}/validation_1000.csv
save_result: true

voc_classes:
  - background
  - aeroplane
  - bicycle
  - bird
  - boat
  - bottle
  - bus
  - car
  - cat
  - chair
  - cow
  - diningtable
  - dog
  - horse
  - motorbike
  - person
  - pottedplant
  - sheep
  - sofa
  - train
  - tvmonitor

validation_pipeline:
  - _target_: edge_model_bench.dataset.transform.LoadingImage
  - _target_: edge_model_bench.dataset.transform.BGR2RGB
  - _target_: edge_model_bench.dataset.transform.Resize
    size: ${input_size}
  - _target_: edge_model_bench.dataset.transform.Normalize
    mean: [0, 0, 0]
    std: [255, 255, 255]
  - _target_: edge_model_bench.dataset.transform.HWC2NCHW

validation_dataset:
  _target_: edge_model_bench.dataset.voc.VocSegmentation
  csv_path: ${..validation_csv}
  pipeline: ${..validation_pipeline}

runner:
  _target_: edge_model_bench.runner.qnn.QnnRunner
  _partial_: true
  initialize: true

evaluator:
  _target_: edge_model_bench.evaluator.segmentation.SemanticSegmentationEvaluator
  num_classes: ${num_classes}
  ignore_index: 255
  class_names: ${voc_classes}

pipeline:
  _target_: edge_model_bench.pipeline.model_evaluator.ModelEvaluator
  model: ${input_bin}
  dataset: ${validation_dataset}
  runner: ${runner}
  postprocessor: ${postprocess.postprocessor}
  evaluator: ${evaluator}
