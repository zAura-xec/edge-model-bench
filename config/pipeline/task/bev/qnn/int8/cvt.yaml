# @package _global_

defaults:
  - /pipeline/task/bev/qnn/task
  - _self_

model_name: cvt
model_type: cvt
model_path: ${benchmark_root}/onnx/bev/cvt-onnx-float/cvt.onnx
image_size: [224, 480]
precision: int8

conversion:
  calibration_dataset: ${work_dir}/input_list.txt
  converter:
    onnx_to_dlc:
      calibration_config:
        _target_: qairt.api.converter.converter_config.CalibrationConfig
        dataset: ${....calibration_dataset}
        use_native_input_files: true
        weights_precision: 8
        act_precision: 8

pipeline:
  calibration_dataset: ${calibration.dataset}

postprocess:
  _target_: edge_model_bench.detector.bev.QnnCVT

evaluator:
  _target_: edge_model_bench.evaluator.bev.NuScenesCvtBevEvaluator
