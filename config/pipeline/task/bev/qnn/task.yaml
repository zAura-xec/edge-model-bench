# @package _global_

defaults:
  - /_base_/converter@conversion: qnn
  - _self_

benchmark_root: ${oc.env:BENCHMARK_ROOT,./benchmark}
dataset_root: ${benchmark_root}/dataset/nuScenes
version: v1.0-mini
work_root: ${oc.env:BENCHMARK_WORK_ROOT,./work}
model_name: bevdet
model_type: bevdet
model_path: ${benchmark_root}/onnx/bev/bevdet-onnx-float/bevdet.onnx
precision: fp16
work_dir: ${work_root}/${model_name}_${precision}
image_size: [256, 704]
validation_csv: ${dataset_root}/validation.csv
calibration_data_list: ${dataset_root}/calibration_512.txt

calibration:
  raw_output_dir: ${work_dir}/raw
  input_list: ${work_dir}/input_list.txt
  pipeline:
    - _target_: edge_model_bench.dataset.nuscenes.PrepareNuScenesInputs
      model: ${model_type}
      image_size: ${image_size}
    - _target_: edge_model_bench.dataset.nuscenes.SaveMultiInputRaw
      output_dir: ${...raw_output_dir}
      input_list_path: ${...input_list}
  dataset:
    _target_: edge_model_bench.dataset.nuscenes.NuScenesMultiView
    root: ${dataset_root}
    version: ${version}
    manifest_path: ${calibration_data_list}
    pipeline: ${..pipeline}

validation_pipeline:
  - _target_: edge_model_bench.dataset.nuscenes.PrepareNuScenesInputs
    model: ${model_type}
    image_size: ${image_size}

validation_dataset:
  _target_: edge_model_bench.dataset.nuscenes.NuScenesMultiView
  root: ${dataset_root}
  version: ${version}
  manifest_path: ${validation_csv}
  pipeline: ${validation_pipeline}

conversion:
  input_model: ${model_path}
  output_dir: ${work_dir}/qnn
  qnn_config:
    model_name: ${model_name}

runner:
  _target_: edge_model_bench.runner.qnn.QnnRunner
  _partial_: true
  initialize: true

postprocess:
  _target_: edge_model_bench.detector.bev.QnnBEVDet

evaluator:
  _target_: edge_model_bench.evaluator.bev.NuScenesBevDetectionEvaluator

pipeline:
  _target_: edge_model_bench.pipeline.model_task.ModelTask
  dataset: ${validation_dataset}
  converter: ${conversion.converter}
  runner: ${runner}
  postprocessor: ${postprocess}
  evaluator: ${evaluator}
