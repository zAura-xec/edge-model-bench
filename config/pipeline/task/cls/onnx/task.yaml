# @package _global_

benchmark_root: ${oc.env:BENCHMARK_ROOT,./benchmark}
work_root: ${oc.env:BENCHMARK_WORK_ROOT,./work}
precision: fp32
work_dir: ${work_root}/${model_name}_${precision}
model_name: resnet50
input_size: [224, 224]
model_path: ${benchmark_root}/onnx/cls/${model_name}-onnx-float/${model_name}.onnx
validation_csv: ${benchmark_root}/dataset/ImageNet-1K/validation_1000.csv

validation_pipeline:
  - _target_: edge_model_bench.dataset.transform.LoadingImage
  - _target_: edge_model_bench.dataset.transform.BGR2RGB
  - _target_: edge_model_bench.dataset.transform.Resize
    size: ${input_size}
  - _target_: edge_model_bench.dataset.transform.Normalize
    mean: [0, 0, 0]
    std: [255, 255, 255]
  - _target_: edge_model_bench.dataset.transform.HWC2NCHW

validation_dataset:
  _target_: edge_model_bench.dataset.imagenet1k.ImageNet1K
  csv_path: ${..validation_csv}
  pipeline: ${..validation_pipeline}

runner:
  _target_: edge_model_bench.runner.onnx.OnnxRunner
  _partial_: true
  providers: [CPUExecutionProvider]

postprocessor:
  _target_: edge_model_bench.classifier.OnnxClassifier
  output_index: 0

evaluator:
  _target_: edge_model_bench.evaluator.cls_task.ClsTaskEvaluator

pipeline:
  _target_: edge_model_bench.pipeline.model_task.ModelTask
  model: ${model_path}
  dataset: ${validation_dataset}
  runner: ${runner}
  postprocessor: ${postprocessor}
  evaluator: ${evaluator}
