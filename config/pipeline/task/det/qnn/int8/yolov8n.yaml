# @package _global_
#
# YOLOv8n QNN int8: convert + COCO detect eval.
# ONNX: ${benchmark_root}/onnx/det/yolo/yolov8n.onnx
# outputs: boxes [1,4,8400], class_logits [1,80,8400]
#
#   uv run python tools/pipeline.py config/pipeline/task/det/qnn/int8/yolov8n.yaml

defaults:
  - /pipeline/task/det/qnn/int8/task
  - _self_

model_name: yolov8n
input_size: [640, 640]
num_classes: 80

# simplified YOLOv8 export is pixel cxcywh (not xyxy)
postprocess:
  postprocessor:
    box_format: cxcywh
