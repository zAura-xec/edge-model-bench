[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "edge-model-bench"
version = "0.1.0"
description = "Configurable accuracy evaluation and inference benchmarking for edge AI models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "hydra-core>=1.3.2,<1.4",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<5",
    "pillow>=10,<13",
    "pyyaml>=6,<7",
    "scikit-learn>=1.3,<2",
    "tqdm>=4.66,<5",
]

[project.urls]
Repository = "https://github.com/zAura-xec/edge-model-bench"
Issues = "https://github.com/zAura-xec/edge-model-bench/issues"

[project.optional-dependencies]
onnx = ["onnx>=1.15,<2", "onnxruntime>=1.18,<2"]

[project.scripts]
edge-model-bench = "edge_model_bench.cli:main"

[dependency-groups]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/edge_model_bench"]

[tool.hatch.build.targets.wheel.force-include]
config = "edge_model_bench/config"

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/NOTICE", "/uv.lock", "/src", "/config", "/tools", "/examples", "/tests", "/docs", "/README*", "/CONTRIBUTING.md", "/SECURITY.md", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
